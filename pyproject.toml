[project]
name = "neetrag"
version = "0.1.0"
description = "NEET.info private, locally hosted RAG assistant (CGPRR AI Developer assignment)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 165
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is kept as readable long lines.
"neetrag/assistant.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
